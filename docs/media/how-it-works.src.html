<!doctype html>
<html><head><meta charset="utf-8"><title>shortform-breakdown: how it works</title>
<style>
@font-face { font-family: Geist; src: url(data:font/woff2;base64,__GEIST__) format("woff2"); font-weight: 100 900; }
@font-face { font-family: GeistMono; src: url(data:font/woff2;base64,__GEISTMONO__) format("woff2"); }
:root { --bg: #f6f5f1; --ink: #16161a; --mute: #8a8a93; --line: #e2e0d8; --card: #ffffff; --accent: #3e63dd; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1280px; height: 960px; overflow: hidden; background: var(--bg); color: var(--ink); font-family: Geist, system-ui, sans-serif; }
.mono { font-family: GeistMono, ui-monospace, monospace; }
#header { position: absolute; left: 32px; right: 32px; top: 26px; height: 60px; display: flex; align-items: center; gap: 7px; }
#brand { font-weight: 650; font-size: 19px; margin-right: 10px; white-space: nowrap; letter-spacing: -0.01em; }
.pill { height: 44px; padding: 0 12px; white-space: nowrap; border-radius: 22px; border: 1.5px solid var(--line); background: var(--card); display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--mute); }
.pill b { width: 24px; height: 24px; border-radius: 12px; background: var(--line); color: var(--mute); display: grid; place-items: center; font-size: 13px; font-weight: 600; }
.pill.on { border-color: var(--ink); color: var(--ink); box-shadow: 0 4px 14px rgba(0,0,0,.08); }
.pill.on b { background: var(--ink); color: #fff; }
.pill.done { color: var(--ink); }
.pill.done b { background: #30a46c; color: #fff; }
.arrow { color: var(--line); font-size: 18px; }
#player { position: absolute; left: 32px; top: 120px; width: 288px; height: 512px; border-radius: 14px; overflow: hidden; background: #000; box-shadow: 0 10px 30px rgba(0,0,0,.18); }
#player canvas { width: 288px; height: 512px; display: block; }
#badge { position: absolute; left: 10px; top: 10px; padding: 4px 9px; border-radius: 6px; background: rgba(0,0,0,.6); color: #fff; font-size: 13px; }
#tl { position: absolute; left: 32px; top: 648px; width: 288px; height: 36px; }
#tl .bar { position: absolute; left: 0; right: 0; top: 14px; height: 8px; border-radius: 4px; background: var(--line); }
#tl .fill { position: absolute; left: 0; top: 14px; height: 8px; border-radius: 4px; background: var(--ink); }
#tl .tick { position: absolute; top: 6px; width: 2px; height: 24px; background: var(--ink); }
#tl .tick.split { background: repeating-linear-gradient(var(--ink) 0 3px, transparent 3px 6px); }
#tl .mid { position: absolute; top: 13px; width: 10px; height: 10px; margin-left: -5px; border-radius: 5px; background: var(--accent); border: 2px solid #fff; }
#tl .seg { position: absolute; top: 12px; height: 12px; }
#tlLabels { position: absolute; left: 32px; top: 688px; width: 288px; display: flex; justify-content: space-between; font-size: 12px; color: var(--mute); }
#src { position: absolute; left: 32px; top: 716px; width: 288px; font-size: 13px; color: var(--mute); line-height: 1.45; }
#caption { position: absolute; left: 32px; top: 790px; width: 288px; font-size: 17px; line-height: 1.42; }
#caption code { font-family: GeistMono, monospace; font-size: 15px; background: #ebe9e1; padding: 1px 5px; border-radius: 4px; }
#table { position: absolute; left: 352px; top: 120px; width: 896px; }
.th, .row { display: grid; grid-template-columns: 30px 108px 30px 1fr 118px 162px 86px; align-items: center; column-gap: 10px; padding: 0 12px; }
.th { height: 28px; font-size: 12px; color: var(--mute); text-transform: uppercase; letter-spacing: .06em; }
.row { height: 46px; border-top: 1px solid var(--line); font-size: 15px; background: transparent; }
.row.hot { background: #fff; box-shadow: inset 3px 0 0 var(--ink); }
.row .n { color: var(--mute); font-size: 13px; }
.row .t { font-size: 13px; }
.row .t i { font-style: normal; color: var(--mute); font-size: 11px; margin-left: 4px; }
.row img { width: 24px; height: 42px; object-fit: cover; border-radius: 3px; display: block; }
.row img.pick { outline: 2.5px solid var(--accent); outline-offset: 1px; }
.row .w { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .w.none { color: var(--mute); font-style: italic; }
.chip { display: inline-block; padding: 3px 10px; border-radius: 12px; color: #fff; font-size: 13px; font-weight: 600; }
.chip small { font-weight: 400; opacity: .85; margin-left: 4px; font-size: 11px; }
.lever { font-size: 13px; }
.dots { display: flex; gap: 4px; }
.dots span { width: 11px; height: 11px; border-radius: 6px; background: var(--line); }
.dots span.f { background: var(--ink); }
#bracket { position: absolute; left: 1080px; top: 92px; width: 168px; height: 20px; font-size: 12px; text-align: center; color: var(--accent); font-weight: 600; }
#sections { position: absolute; left: 340px; top: 148px; width: 8px; }
#sections div { position: absolute; left: 0; width: 6px; border-radius: 3px; }
#result { position: absolute; left: 32px; top: 120px; width: 288px; height: 512px; border-radius: 14px; background: var(--card); padding: 22px 20px; box-shadow: 0 10px 30px rgba(0,0,0,.10); }
#result h3 { font-size: 13px; color: var(--mute); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; margin: 14px 0 6px; }
#result h3:first-child { margin-top: 0; }
#result .big { font-size: 26px; font-weight: 650; letter-spacing: -0.01em; }
#result .sec { display: flex; align-items: center; gap: 8px; font-size: 14px; margin: 5px 0; }
#result .sec .sw { width: 10px; height: 10px; border-radius: 3px; }
#result .file { font-size: 13px; margin-top: 4px; }
</style></head>
<body>
<div id="header"><div id="brand">shortform-breakdown</div></div>
<div id="player"><canvas id="cv" width="288" height="512"></canvas><div id="badge" class="mono"></div></div>
<div id="result"></div>
<div id="tl"><div class="bar"></div><div class="fill"></div></div>
<div id="tlLabels" class="mono"><span>0 s</span><span id="tlEnd"></span></div>
<div id="src"></div>
<div id="caption"></div>
<div id="bracket"></div>
<div id="sections"></div>
<div id="table"><div class="th"><span>#</span><span>time</span><span></span><span>words</span><span>beat</span><span>lever</span><span>hold</span></div></div>
<script>
const D = __DATA__;
const META = { who: "@zachking", title: "a message to all AI", views: "67.8M views", url: "tiktok.com/@zachking/video/7655004069190192398" };
const COLORS = { hook: "#e5484d", setup: "#f5a524", value: "#3e63dd", proof: "#30a46c", payoff: "#8e4ec6", cta: "#d6409f" };
const STEPS = [["detectScenes"], ["transcribe", "alignWords"], ["extractFrames"], ["decide"], ["Analysis"]];
// Phase times (seconds). Each step holds long enough to read.
const T = { intro: 0, scenes: 3, words: 10.5, frames: 17, decide: 21.5, result: 29, end: 37 };
const DUR = T.end, N = D.scenes.length, LEN = D.duration;
window.VIDEO = { w: 1280, h: 960, duration: DUR };

const $ = (id) => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = (x) => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const prog = (t, a, b) => clamp((t - a) / (b - a));
const fmt = (s) => s.toFixed(1);

// Header: the fixed map of steps.
const header = $("header"), pills = [];
STEPS.forEach((fns, i) => {
  if (i) { const a = document.createElement("span"); a.className = "arrow"; a.textContent = "→"; header.appendChild(a); }
  const p = document.createElement("div"); p.className = "pill";
  p.innerHTML = `<b>${i + 1}</b><span class="mono">${fns.join(" · ")}</span>`;
  header.appendChild(p); pills.push(p);
});
$("src").innerHTML = `<b style="color:var(--ink)">${META.who}</b> · “${META.title}”<br>${META.views} · ${fmt(LEN)} s · ${N} scenes`;
$("tlEnd").textContent = fmt(LEN) + " s";

// Timeline marks.
const tl = $("tl"), ticks = [], mids = [], segs = [];
D.scenes.forEach((s, i) => {
  if (i) { const k = document.createElement("div"); k.className = "tick" + (s.cut === false ? " split" : ""); k.style.left = (s.start / LEN * 288 - 1) + "px"; tl.appendChild(k); ticks.push(k); } else ticks.push(null);
  const m = document.createElement("div"); m.className = "mid"; m.style.left = ((s.start + s.end) / 2 / LEN * 288) + "px"; tl.appendChild(m); mids.push(m);
  const g = document.createElement("div"); g.className = "seg"; g.style.left = (s.start / LEN * 288) + "px"; g.style.width = ((s.end - s.start) / LEN * 288 - 1) + "px";
  g.style.background = COLORS[s.beat] || "transparent"; tl.appendChild(g); segs.push(g);
});

// Table rows.
const table = $("table"), rows = [];
D.scenes.forEach((s, i) => {
  const r = document.createElement("div"); r.className = "row";
  const words = (s.transcript || "").trim();
  r.innerHTML = `<span class="n mono">${i + 1}</span><span class="t mono">${fmt(s.start)}–${fmt(s.end)}${s.cut === false ? "<i>split</i>" : ""}</span>` +
    `<img src="data:image/jpeg;base64,${D.thumbs[i]}"><span class="w${words ? "" : " none"}"></span>` +
    `<span class="b">${s.beat ? `<span class="chip" style="background:${COLORS[s.beat]}">${s.beat}<small>${Math.round(s.beatP * 100)}%</small></span>` : ""}</span>` +
    `<span class="lever mono">${s.lever || ""}</span><span class="dots">${[0, 1, 2, 3, 4].map((k) => `<span class="${k < Math.round(s.hold) ? "f" : ""}"></span>`).join("")}</span>`;
  table.appendChild(r);
  rows.push({ el: r, words, w: r.querySelector(".w"), img: r.querySelector("img"), b: r.querySelector(".b"), l: r.querySelector(".lever"), d: r.querySelector(".dots"), t: r.querySelector(".t") });
});

// Sections along the table's left edge, and the result card.
const secBox = $("sections"), secEls = [];
const rowTop = (i) => i * 46;
(D.video?.sections || []).forEach((x) => {
  const a = D.scenes.findIndex((s) => Math.abs(s.start - x.start) < 1e-6), b = D.scenes.findIndex((s) => Math.abs(s.end - x.end) < 1e-6);
  const e = document.createElement("div"); e.style.top = (rowTop(a) + 4) + "px"; e.style.height = (rowTop(b + 1) - rowTop(a) - 8) + "px"; e.style.background = COLORS[x.beat];
  secBox.appendChild(e); secEls.push(e);
});
if (D.video) {
  const v = D.video, secs = v.sections.map((x) => `<div class="sec"><span class="sw" style="background:${COLORS[x.beat]}"></span><span class="mono">${fmt(x.start)}–${fmt(x.end)} s</span><b>${x.beat}</b></div>`);
  const shown = secs.length > 7 ? [...secs.slice(0, 6), `<div class="sec" style="color:var(--mute)">+ ${secs.length - 6} more</div>`] : secs;
  $("result").innerHTML = `<h3>format · goal</h3><div class="big">${v.format}</div><div class="mono" style="font-size:14px">${v.goal} · sells ${Math.round(v.sells * 100)}%</div>` +
    `<h3>made as</h3><div class="mono" style="font-size:14px">${v.production}<br>${v.voice}</div>` +
    `<h3>sections</h3>${shown.join("")}<h3>writes</h3><div class="file mono">analysis.json · report.html<br>frames/01–${String(N).padStart(2, "0")}.jpg · sheet.jpg</div>`;
}

// Real frames of the video.
const cv = $("cv"), ctx = cv.getContext("2d");
const imgs = D.play.map((b) => { const im = new Image(); im.src = "data:image/jpeg;base64," + b; return im; });
const thumbsBig = D.thumbs.map((b) => { const im = new Image(); im.src = "data:image/jpeg;base64," + b; return im; });
function draw(im) { if (!im.naturalWidth) return; const r = Math.max(288 / im.naturalWidth, 512 / im.naturalHeight); const w = im.naturalWidth * r, h = im.naturalHeight * r; ctx.drawImage(im, (288 - w) / 2, (512 - h) / 2, w, h); }
const frameAt = (sec) => imgs[clamp(Math.floor(sec * D.playFps), 0, imgs.length - 1)];
const sceneAt = (sec) => { for (let i = N - 1; i >= 0; i--) if (sec >= D.scenes[i].start) return i; return 0; };

const CAPTIONS = [
  [T.intro, `A real TikTok goes in, as a file or a <code>Buffer</code>.`],
  [T.scenes, `<code>detectScenes</code>: ffmpeg finds the cuts. A take over 5 s is split (dashed). <b>${N} scenes</b>.`],
  [T.words, `<code>transcribe</code> gives every word a time; <code>alignWords</code> puts each word in the scene it is said in.`],
  [T.frames, `<code>extractFrames</code>: the middle frame of each scene (512 px) is what the model sees.`],
  [T.decide, `<code>decide</code>: <b>one</b> OpenAI Decisions request reads every scene in order, frame next to words, and labels each one.`],
  [T.result, `The <code>Analysis</code>: scenes with their labels, sections, and what kind of video it is.`],
];

function seek(t) {
  t = clamp(t, 0, DUR - 1e-3);
  const phase = t < T.scenes ? 0 : t < T.words ? 1 : t < T.frames ? 2 : t < T.decide ? 3 : t < T.result ? 4 : 5;
  pills.forEach((p, i) => { p.className = "pill" + (phase - 1 === i ? " on" : phase - 1 > i ? " done" : ""); });
  let cap = CAPTIONS[0][1]; for (const [a, c] of CAPTIONS) if (t >= a) cap = c;
  $("caption").innerHTML = cap;
  $("caption").style.opacity = String(Math.min(...CAPTIONS.map(([a]) => (t >= a ? clamp((t - a) / 0.35) : 1)).filter((x) => x < 1), 1));

  // What the player shows, and where the playhead is.
  let vsec = 0, hot = -1, sweep = 0;
  if (phase === 0) vsec = t - T.intro;
  else if (phase === 1) { sweep = ease(prog(t, T.scenes + 0.3, T.words - 0.8)); vsec = sweep * LEN; }
  else if (phase === 2) { sweep = ease(prog(t, T.words + 0.3, T.frames - 0.8)); vsec = sweep * LEN; hot = sceneAt(vsec); }
  else if (phase === 3) { const k = prog(t, T.frames + 0.3, T.decide - 0.5); hot = Math.min(N - 1, Math.floor(k * N)); }
  else if (phase === 4) { hot = Math.min(N - 1, Math.floor(prog(t, T.decide + 1.2, T.result - 2) * N)); if (prog(t, T.decide + 1.2, T.result - 2) >= 1) hot = -1; }
  const showResult = phase === 5;
  $("player").style.opacity = showResult ? String(1 - prog(t, T.result, T.result + 0.5)) : "1";
  $("result").style.opacity = showResult ? String(prog(t, T.result, T.result + 0.5)) : "0";
  if (phase === 3 && hot >= 0) draw(thumbsBig[hot]); else draw(frameAt(phase >= 3 ? 0 : vsec));
  $("badge").textContent = phase === 3 && hot >= 0 ? `scene ${hot + 1} · middle frame` : `${fmt(phase >= 3 ? 0 : vsec)} s`;
  $("badge").style.opacity = phase >= 4 ? "0" : "1";

  const fillTo = phase === 0 ? vsec / LEN : phase <= 2 ? sweep : 1;
  tl.querySelector(".fill").style.width = (fillTo * 288) + "px";
  tl.querySelector(".fill").style.opacity = phase >= 3 ? "0" : "1";
  const cutUntil = phase === 1 ? vsec : phase > 1 ? LEN + 1 : -1;
  ticks.forEach((k, i) => { if (k) k.style.opacity = D.scenes[i].start <= cutUntil ? "1" : "0"; });
  mids.forEach((m, i) => { m.style.opacity = phase === 3 ? (i <= hot ? "1" : "0.15") : "0"; });
  segs.forEach((g, i) => { g.style.opacity = phase >= 4 ? (phase === 5 || i < hot || hot === -1 ? "1" : "0") : "0"; });

  rows.forEach((r, i) => {
    const s = D.scenes[i];
    const shown = phase > 1 || (phase === 1 && s.start <= vsec);
    const enter = phase === 1 ? prog(vsec, s.start, s.start + LEN * 0.04) : 1;
    r.el.style.opacity = shown ? String(0.15 + 0.85 * ease(enter)) : "0";
    r.el.style.transform = shown ? `translateX(${(1 - ease(enter)) * 24}px)` : "translateX(24px)";
    r.el.classList.toggle("hot", i === hot);
    // Words appear as the playhead passes the scene.
    const wp = phase > 2 ? 1 : phase === 2 ? prog(vsec, s.start, s.end) : 0;
    const text = r.words || "(nothing said)";
    r.w.textContent = phase < 2 ? "" : (r.words ? r.words.slice(0, Math.ceil(r.words.length * wp)) : wp >= 1 ? text : "");
    r.img.classList.toggle("pick", phase === 3 && i <= hot);
    r.img.style.opacity = phase === 3 && i > hot ? "0.35" : "1";
    const lab = phase === 5 ? 1 : phase === 4 ? (hot === -1 ? 1 : i < hot ? 1 : i === hot ? prog(t, T.decide + 1.2 + (i / N) * (T.result - 3.2 - T.decide), T.decide + 1.2 + ((i + 1) / N) * (T.result - 3.2 - T.decide)) : 0) : 0;
    [r.b, r.l, r.d].forEach((e) => { e.style.opacity = String(ease(lab)); });
  });
  $("bracket").textContent = phase === 4 ? "1 request · gpt-6-luna" : "";
  secEls.forEach((e) => { e.style.opacity = String(phase === 5 ? prog(t, T.result + 0.3, T.result + 1) : 0); });
  // Fade to the start so the loop is seamless.
  document.body.style.opacity = String(1 - prog(t, DUR - 0.6, DUR) * 0.0);
}
Promise.all([...imgs, ...thumbsBig].map((im) => im.decode().catch(() => {}))).then(() => { window.seek = seek; if (!location.search.includes("render")) { const t0 = performance.now(); const loop = () => { seek(((performance.now() - t0) / 1000) % DUR); requestAnimationFrame(loop); }; loop(); } else seek(0); });
</script></body></html>
