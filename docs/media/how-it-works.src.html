<!doctype html>
<html><head><meta charset="utf-8"><title>shortform-breakdown: how it works</title>
<style>
@font-face { font-family: Geist; src: url(data:font/woff2;base64,__GEIST__) format("woff2"); font-weight: 100 900; }
@font-face { font-family: GeistMono; src: url(data:font/woff2;base64,__GEISTMONO__) format("woff2"); }
:root { --bg: #f6f5f1; --ink: #16161a; --mute: #8a8a93; --line: #e2e0d8; --card: #fff; --accent: #3e63dd; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1280px; height: 720px; overflow: hidden; background: var(--bg); color: var(--ink); font-family: Geist, system-ui, sans-serif; }
.mono { font-family: GeistMono, ui-monospace, monospace; }
#title { position: absolute; left: 40px; top: 26px; font-size: 20px; font-weight: 650; letter-spacing: -0.01em; }
#title span { font-weight: 400; color: var(--mute); margin-left: 10px; font-size: 16px; }
#player { position: absolute; left: 40px; top: 80px; width: 300px; height: 533px; border-radius: 14px; overflow: hidden; background: #000; box-shadow: 0 10px 30px rgba(0,0,0,.18); }
#player canvas { width: 300px; height: 533px; display: block; }
#clock { position: absolute; left: 10px; top: 10px; padding: 4px 9px; border-radius: 6px; background: rgba(0,0,0,.6); color: #fff; font-size: 13px; }
#src { position: absolute; left: 40px; top: 626px; width: 300px; font-size: 13px; color: var(--mute); line-height: 1.45; }
#src b { color: var(--ink); }
#panel { position: absolute; left: 380px; top: 80px; width: 860px; height: 600px; }
.lab { position: absolute; left: 0; width: 76px; font-size: 12px; color: var(--mute); text-transform: uppercase; letter-spacing: .06em; }
#step { position: absolute; left: 0; top: 0; height: 34px; display: flex; align-items: center; gap: 10px; font-size: 16px; }
#step b { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 13px; background: var(--ink); color: #fff; font-size: 13px; }
#step code { font-family: GeistMono, monospace; font-size: 14px; background: #ebe9e1; padding: 2px 6px; border-radius: 4px; }
#lane { position: absolute; left: 84px; top: 52px; width: 776px; height: 420px; }
#ruler { position: absolute; left: 0; right: 0; top: 0; height: 18px; font-size: 11px; color: var(--mute); }
#ruler span { position: absolute; top: 0; transform: translateX(-50%); }
.blk { position: absolute; border-radius: 5px; overflow: hidden; }
.film { top: 24px; height: 150px; background: #222 center/cover no-repeat; }
.film i { position: absolute; left: 4px; bottom: 4px; font-style: normal; font-size: 10px; color: #fff; background: rgba(0,0,0,.55); padding: 1px 4px; border-radius: 3px; }
.beat { top: 190px; height: 34px; color: #fff; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center; }
.hold { top: 236px; height: 48px; overflow: visible; }
.hold div { position: absolute; left: 0; right: 0; bottom: 0; border-radius: 4px; background: var(--ink); }
.lever { top: 296px; height: 24px; font-size: 10px; display: flex; align-items: center; justify-content: center; background: #ebe9e1; color: var(--ink); white-space: nowrap; }
.sec { top: 300px; height: 40px; border: 2px solid; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 650; background: var(--card); }
#head { position: absolute; top: 18px; width: 2px; height: 326px; margin-left: -1px; background: var(--ink); z-index: 2; }
#head::before { content: ""; position: absolute; left: -5px; top: -6px; border: 6px solid transparent; border-top-color: var(--ink); }
#ask { position: absolute; left: -6px; top: 182px; height: 110px; border-radius: 8px; border: 2px dashed var(--accent); }
#ask span { position: absolute; right: 8px; top: -24px; color: var(--accent); font-size: 13px; font-weight: 600; white-space: nowrap; }
#card { position: absolute; left: 84px; top: 492px; width: 776px; height: 108px; border-radius: 12px; background: var(--card); box-shadow: 0 6px 20px rgba(0,0,0,.07); padding: 16px 20px; display: grid; grid-template-columns: 230px 1fr; gap: 6px 22px; }
#card .k { font-size: 12px; color: var(--mute); text-transform: uppercase; letter-spacing: .06em; }
#card .v { font-size: 15px; }
#card .q { grid-column: 2; grid-row: 1 / span 3; font-size: 17px; line-height: 1.4; align-self: center; }
.chip { display: inline-block; padding: 2px 9px; border-radius: 11px; color: #fff; font-size: 13px; font-weight: 600; }
#verdict { position: absolute; left: 84px; top: 492px; width: 776px; height: 108px; display: flex; gap: 14px; }
#verdict > div { flex: 1; border-radius: 12px; background: var(--card); box-shadow: 0 6px 20px rgba(0,0,0,.07); padding: 16px 18px; }
#verdict .k { font-size: 12px; color: var(--mute); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 8px; }
#verdict .v { font-size: 22px; font-weight: 650; }
#verdict .s { font-size: 13px; color: var(--mute); margin-top: 2px; }
</style></head>
<body>
<div id="title">shortform-breakdown<span>one video → scenes on a timeline → one decision labels them all</span></div>
<div id="player"><canvas id="cv" width="300" height="533"></canvas><div id="clock" class="mono"></div></div>
<div id="src"></div>
<div id="panel">
  <div id="step"></div>
  <div class="lab" style="top:140px">scenes</div>
  <div class="lab" style="top:262px">beat</div>
  <div class="lab" style="top:316px">hold</div>
  <div class="lab" style="top:366px">sections</div>
  <div id="lane"><div id="ruler" class="mono"></div><div id="ask"><span>1 Decisions request · gpt-6-luna</span></div><div id="head"></div></div>
  <div id="card"></div>
  <div id="verdict"></div>
</div>
<script>
const D = __DATA__;
const META = { who: "@zachking", title: "a message to all AI", views: "67.8M views" };
const COLORS = { hook: "#e5484d", setup: "#f5a524", value: "#3e63dd", proof: "#30a46c", payoff: "#8e4ec6", cta: "#d6409f" };
// Phases (s): the video plays and is cut; one decision labels every scene at once; then a slow pass shows each scene's labels.
const T = { cut: 0.8, cutEnd: 9, decide: 9.6, labels: 10.2, labelsEnd: 11.2, secs: 11.8, pass: 14, passEnd: 26, end: 27.5 };
const DUR = T.end, N = D.scenes.length, LEN = D.duration, W = 776, GAP = 3;
window.VIDEO = { w: 1280, h: 720, duration: DUR };

const $ = (id) => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = (x) => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const prog = (t, a, b) => clamp((t - a) / (b - a));
const fmt = (s) => s.toFixed(1);
const X = (sec) => sec / LEN * W;
const pct = (p) => Math.round(p * 100) + "%";

$("src").innerHTML = `<b>${META.who}</b> · “${META.title}”<br>${META.views} · ${fmt(LEN)} s`;
const ruler = $("ruler");
for (let s = 0; s <= LEN; s += 5) { const e = document.createElement("span"); e.style.left = X(s) + "px"; e.textContent = s + " s"; ruler.appendChild(e); }

const lane = $("lane"), mk = (cls, s, e) => { const d = document.createElement("div"); d.className = "blk " + cls; d.style.left = (X(s) + GAP / 2) + "px"; d.style.width = (X(e) - X(s) - GAP) + "px"; lane.appendChild(d); return d; };
const films = D.scenes.map((s, i) => { const d = mk("film", s.start, s.end); d.style.backgroundImage = `url(data:image/jpeg;base64,${D.thumbs[i]})`; d.innerHTML = `<i class="mono">${i + 1}</i>`; return d; });
const rest = document.createElement("div"); rest.className = "blk film"; rest.style.background = "#d9d6cc"; lane.appendChild(rest);
const beats = D.scenes.map((s) => { const d = mk("beat", s.start, s.end); d.style.background = COLORS[s.beat]; d.textContent = X(s.end) - X(s.start) > 54 ? s.beat : ""; return d; });
const holds = D.scenes.map((s) => { const d = mk("hold", s.start, s.end); d.innerHTML = `<div style="height:${Math.max(3, s.hold / 4 * 48)}px"></div>`; return d; });
const levers = [];
const secs = (D.video.sections || []).map((x) => { const d = mk("sec", x.start, x.end); d.style.borderColor = COLORS[x.beat]; d.style.color = COLORS[x.beat]; d.textContent = X(x.end) - X(x.start) > 40 ? x.beat : ""; return d; });
const ask = $("ask"); ask.style.width = (W + 12) + "px";

const v = D.video;
$("verdict").innerHTML = `<div><div class="k">format</div><div class="v">${v.format}</div><div class="s mono">${pct(v.formatP)}</div></div>` +
  `<div><div class="k">goal</div><div class="v">${v.goal}</div><div class="s mono">sells ${pct(v.sells)}</div></div>` +
  `<div><div class="k">made as</div><div class="v" style="font-size:17px">${v.production.replaceAll("_", " ")}</div><div class="s mono">${v.voice.replaceAll("_", " ")}</div></div>`;

const cv = $("cv"), ctx = cv.getContext("2d");
const imgs = D.play.map((b) => { const im = new Image(); im.src = "data:image/jpeg;base64," + b; return im; });
function draw(im) { if (!im.naturalWidth) return; const r = Math.max(300 / im.naturalWidth, 533 / im.naturalHeight); const w = im.naturalWidth * r, h = im.naturalHeight * r; ctx.drawImage(im, (300 - w) / 2, (533 - h) / 2, w, h); }
const frameAt = (sec) => imgs[clamp(Math.floor(sec * D.playFps), 0, imgs.length - 1)];
const sceneAt = (sec) => { for (let i = N - 1; i >= 0; i--) if (sec >= D.scenes[i].start) return i; return 0; };

const STEP = [
  [0, 1, `<code>detectScenes</code> cuts the video where the shot changes`],
  [T.decide, 2, `<code>decide</code>: one request reads every scene's frame and words, and labels them all at once`],
  [T.pass, 3, `Each scene on the timeline, with what the decision gave it`],
];

function seek(t) {
  t = clamp(t, 0, DUR - 1e-3);
  let st = STEP[0]; for (const s of STEP) if (t >= s[0]) st = s;
  $("step").innerHTML = `<b>${st[1]}</b><span>${st[2]}</span>`;
  $("step").style.opacity = String(clamp((t - st[0]) / 0.3 + (st[0] === 0 ? 1 : 0)));

  // The playhead: once through while cutting, then once over the labelled timeline.
  let vsec = 0, head = false;
  if (t < T.cutEnd) { vsec = ease(prog(t, T.cut, T.cutEnd)) * LEN; head = t >= T.cut; }
  else if (t >= T.pass && t < T.passEnd) { vsec = prog(t, T.pass, T.passEnd) * LEN; head = true; }
  else if (t >= T.passEnd) vsec = LEN - 0.01;
  draw(frameAt(vsec));
  $("clock").textContent = fmt(vsec) + " s";
  $("head").style.left = X(vsec) + "px";
  $("head").style.opacity = head ? "1" : "0";

  // Cuts: a scene's block appears when the playhead reaches it; ahead of the playhead is one grey strip.
  const cutting = t < T.cutEnd, cur = sceneAt(vsec);
  films.forEach((d, i) => { d.style.display = !cutting || i <= cur && t >= T.cut ? "block" : "none"; });
  const restFrom = !cutting ? LEN : t < T.cut ? 0 : D.scenes[cur].end;
  rest.style.display = restFrom >= LEN ? "none" : "block";
  rest.style.left = (X(restFrom) + (restFrom ? GAP / 2 : 0)) + "px"; rest.style.width = (W - X(restFrom) - (restFrom ? GAP / 2 : 0)) + "px";
  rest.innerHTML = t < T.cut ? `<i class="mono" style="font-size:12px">video.mp4 · ${fmt(LEN)} s</i>` : "";
  // While cutting, the current scene's block grows with the playhead.
  if (cutting && t >= T.cut) { const s = D.scenes[cur]; films[cur].style.width = Math.max(2, X(Math.min(vsec, s.end)) - X(s.start) - GAP / 2) + "px"; rest.style.left = (X(vsec) + GAP / 2) + "px"; rest.style.width = Math.max(0, W - X(vsec) - GAP / 2) + "px"; rest.style.display = "block"; }
  else films.forEach((d, i) => { const s = D.scenes[i]; d.style.width = (X(s.end) - X(s.start) - GAP) + "px"; });

  // The decision: the dashed request box over every row, then every label at once.
  ask.style.opacity = String(prog(t, T.decide - 0.2, T.decide + 0.2) * (1 - prog(t, T.labelsEnd + 0.4, T.labelsEnd + 0.9)));
  const lab = (i) => ease(prog(t, T.labels + i * 0.03, T.labels + i * 0.03 + 0.5));
  beats.forEach((d, i) => { d.style.opacity = String(lab(i)); d.style.transform = `translateY(${(1 - lab(i)) * -10}px)`; });
  holds.forEach((d, i) => { d.style.opacity = String(lab(i)); d.firstChild.style.transform = `scaleY(${lab(i)})`; d.firstChild.style.transformOrigin = "bottom"; });
  levers.forEach((d, i) => { d.style.opacity = String(lab(i)); });
  secs.forEach((d) => { d.style.opacity = String(ease(prog(t, T.secs, T.secs + 0.5))); });

  // The pass: the scene under the playhead stands out in every row, its labels in the card.
  const hot = t >= T.pass && t < T.passEnd ? cur : -1;
  if (t >= T.pass) [films, beats, holds, levers].forEach((row) => row.forEach((d, i) => { d.style.opacity = hot === -1 || i === hot ? "1" : "0.28"; }));
  const card = $("card");
  if (hot >= 0) {
    const s = D.scenes[hot];
    card.innerHTML = `<div><span class="k">scene ${hot + 1} · </span><span class="mono v">${fmt(s.start)}–${fmt(s.end)} s</span></div>` +
      `<div><span class="chip" style="background:${COLORS[s.beat]}">${s.beat} ${pct(s.beatP)}</span> <span class="mono" style="font-size:13px">${s.lever}</span></div>` +
      `<div class="mono" style="font-size:13px">hold ${s.hold.toFixed(1)} / 4${s.text != null ? ` · text ${pct(s.text)}` : ""}</div>` +
      `<div class="q">${s.transcript ? "“" + s.transcript + "”" : '<span style="color:var(--mute)">(nothing said)</span>'}</div>`;
  }
  card.style.opacity = hot >= 0 ? "1" : "0";
  $("verdict").style.opacity = String(hot >= 0 ? 0 : ease(prog(t, T.secs + 0.3, T.secs + 0.8)));
  $("panel").style.opacity = String(1 - prog(t, DUR - 0.5, DUR));
}
Promise.all(imgs.map((im) => im.decode().catch(() => {}))).then(() => {
  window.seek = seek; seek(0);
  if (!location.search.includes("render")) { const t0 = performance.now(); const loop = () => { seek(((performance.now() - t0) / 1000) % DUR); requestAnimationFrame(loop); }; loop(); }
});
</script></body></html>
