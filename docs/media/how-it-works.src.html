<!doctype html>
<html><head><meta charset="utf-8"><title>shortform-breakdown · how it works</title>
<style>
@font-face{font-family:Geist;src:url(data:font/woff2;base64,__GEIST__) format("woff2");font-weight:100 900}
@font-face{font-family:GeistMono;src:url(data:font/woff2;base64,__GEISTMONO__) format("woff2");font-weight:500}
:root{--bg:#0C0C0E;--grid:#1E1E22;--s1:#1C1C1F;--s2:#2C2C2E;--fg:#F2F2F7;--mute:#8E8E93;--acc:#0A84FF;
  --hook:#FF453A;--value:#0A84FF;--cta:#FF375F;--green:#30D158}
html,body{margin:0;background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;background:var(--bg);overflow:hidden;perspective:2600px;perspective-origin:50% 50%;
  font-family:Geist,system-ui,sans-serif;color:var(--fg);transform-origin:0 0}
#cam{position:absolute;left:0;top:0;transform-origin:0 0;transform-style:preserve-3d}
#world{position:absolute;left:-400px;top:-600px;width:4800px;height:3400px;
  background-image:radial-gradient(circle,var(--grid) 2.4px,transparent 3px);background-size:44px 44px;background-position:22px 22px}
.abs{position:absolute;white-space:nowrap}
.card{position:absolute;background:var(--s1);border:1px solid #2a2a2e;border-radius:28px;box-shadow:0 18px 50px rgba(0,0,0,.45)}
.t1{font-weight:650;font-size:30px;letter-spacing:-.3px}
.t2{font-weight:450;font-size:21px;color:var(--mute)}
.mono{font-family:GeistMono,ui-monospace,monospace}
#hero{position:absolute;left:0;top:0;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:#fff;
  box-shadow:0 4px 14px rgba(0,0,0,.5);will-change:transform}
#halo{position:absolute;left:0;top:0;width:240px;height:240px;margin:-120px 0 0 -120px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.55),rgba(255,255,255,0) 62%);opacity:0}
.pill{position:absolute;border-radius:99px;font-weight:650;font-size:20px;color:#fff;padding:6px 16px;transform-origin:50% 50%}
#controls{position:fixed;left:0;right:0;bottom:0;padding:10px 16px;background:#111;color:#ccc;font:13px system-ui;display:flex;gap:10px;align-items:center}
#controls input{flex:1}
</style></head><body>
<div id="stage"><div id="cam"><div id="world"></div><div id="layer" class="abs" style="left:0;top:0"></div></div></div>
<div id="controls"><button id="play">Play</button><input id="scrub" type="range" min="0" max="12" step="0.01" value="0"><span id="tval">0.00</span></div>
<script>
/* Beat sheet (12 s loop, 115 BPM; seek(12) == seek(0))
   0.00  hero lands on the toggle knob (off)              tick C5
   0.00-0.55 knob slides on: "Break down" toggle fills    soft click
   0.55-0.95 hop onto the film strip                      tick D5
   0.95-2.75 rolls along: scenes fill, cuts at 1.5 s, 3 s  cut ticks
   3.20  falls on card "Transcript"                        pop E5
   3.65  card "Align"                                      pop G5
   4.10  card "Frames"                                     pop A5
   4.65  lands on the Decisions table, row 1 → hook       pop
   5.45  row 2 → value · 6.25 row 3 → cta                  pops
   7.30  lands on Export: toast "Wrote clip.mp4.breakdown/" button thud
   7.30-7.85 payoff hold
   7.85  launch: slow-motion arc back to the start, camera pulls out to the whole course (tilted)   whoosh up
   9.6-10.4 every station resets behind it
   11.2-12 dive back to the toggle                         whoosh down, lands = 0.00
*/
const DUR = 12, W = 1920, H = 1080;
window.VIDEO = { w: W, h: H, duration: DUR };
const RENDER = location.search.includes("render");

// ---------- helpers (from the skill) ----------
function spring(t, w = 14, z = 0.82) { if (t <= 0) return 0; if (z >= 1) return 1 - Math.exp(-w * t) * (1 + w * t);
  const wd = w * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + (z * w / wd) * Math.sin(wd * t)); }
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = x => (x = clamp(x), x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const easeOut = x => 1 - Math.pow(1 - clamp(x), 3);
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const kf = keys => t => { if (t <= keys[0][0]) return keys[0][1]; for (let i = 1; i < keys.length; i++) { const [a, va] = keys[i - 1], [b, vb, e = ease] = keys[i]; if (t <= b) return lerp(va, vb, e((t - a) / (b - a))); } return keys[keys.length - 1][1]; };
const rng = s => () => (s = (s + 0x6D2B79F5) | 0, s = Math.imul(s ^ (s >>> 15), 1 | s), s ^= s + Math.imul(s ^ (s >>> 7), 61 | s), ((s ^ (s >>> 14)) >>> 0) / 4294967296);
const pop = (t, t0) => t < t0 ? 0 : spring(t - t0, 16, 0.55);      // 0 → 1 with overshoot

// ---------- the world ----------
const L = document.getElementById("layer");
const el = (html) => { const d = document.createElement("div"); d.innerHTML = html.trim(); const n = d.firstChild; L.appendChild(n); return n; };
const R = 26, G = 6000;                       // hero radius, gravity (world px, px/s²)
const BEAT = { hook: "#FF453A", value: "#0A84FF", cta: "#FF375F" };

// Station 1: the input clip and its toggle
const s1 = el(`<div class="card" style="left:360px;top:372px;width:420px;height:230px">
  <div class="abs" style="left:26px;top:40px;width:84px;height:150px;border-radius:12px;overflow:hidden;display:flex;flex-direction:column">
    <div style="flex:1;background:#FF453A"></div><div style="flex:1;background:#30D158"></div><div style="flex:1;background:#0A84FF"></div></div>
  <div class="abs t1" style="left:134px;top:36px">clip.mp4</div>
  <div class="abs t2" style="left:134px;top:76px">4.5 s · 360×640</div>
  <div class="abs t2" style="left:200px;top:180px;width:120px;text-align:center;color:var(--fg);font-size:18px">analyze</div></div>`);
const tog = el(`<div class="abs" style="left:560px;top:478px;width:120px;height:64px;border-radius:32px;background:#3A3A3C"></div>`);
const slotOff = el(`<div class="abs" style="left:566px;top:484px;width:52px;height:52px;border-radius:50%;border:2px solid rgba(255,255,255,.22);box-sizing:border-box"></div>`);
const slotOn = el(`<div class="abs" style="left:622px;top:484px;width:52px;height:52px;border-radius:50%;border:2px solid rgba(255,255,255,.35);box-sizing:border-box"></div>`);

// Station 2: the film strip that becomes scenes
const X0 = 800, X3 = 2220, XB = X0 + (X3 - X0) / 3, XC = X0 + 2 * (X3 - X0) / 3, TY = 560;
el(`<div class="abs t1" style="left:${X0}px;top:${TY - 132}px">Scenes</div>`);
const scCount = el(`<div class="abs t2 mono" style="left:${X0 + 128}px;top:${TY - 126}px">detectScenes · 0</div>`);
el(`<div class="abs" style="left:${X0}px;top:${TY}px;width:${X3 - X0}px;height:64px;border-radius:14px;background:#26262A;
  background-image:repeating-linear-gradient(90deg,#3a3a40 0 14px,transparent 14px 34px);background-size:34px 9px;background-repeat:repeat-x;
  background-position:0 6px,0 49px"></div>`);
const fills = ["#FF453A", "#30D158", "#0A84FF"].map((c, i) => el(`<div class="abs" style="left:${X0 + i * (X3 - X0) / 3}px;top:${TY + 15}px;height:34px;width:0;background:${c};opacity:.9;border-radius:${i === 0 ? "8px 0 0 8px" : i === 2 ? "0 8px 8px 0" : "0"}"></div>`));
const cuts = [XB, XC].map((x, i) => el(`<div class="abs" style="left:${x - 3}px;top:${TY - 10}px;width:6px;height:84px;background:#fff;border-radius:3px;transform-origin:50% 100%"></div>`));
const cutTags = [XB, XC].map((x, i) => el(`<div class="abs t2 mono" style="left:${x - 34}px;top:${TY + 84}px;font-size:20px">${["1.5 s", "3.0 s"][i]}</div>`));

// Station 3: notification staircase
const CARDS = [
  { x: 2300, y: 820, icon: "#FF9F0A", glyph: "T", title: "Transcript", body: "“Wait for it.”  “Follow!”" },
  { x: 2600, y: 1090, icon: "#30D158", glyph: "A", title: "Align", body: "words → the scene they fall in" },
  { x: 2900, y: 1360, icon: "#BF5AF2", glyph: "F", title: "Frames", body: "the middle of every scene" },
];
const cardEls = CARDS.map((c) => el(`<div class="card" style="left:${c.x}px;top:${c.y}px;width:340px;height:120px;border-radius:24px;transform-origin:50% 0">
  <div class="abs" style="left:18px;top:20px;width:48px;height:48px;border-radius:12px;background:${c.icon};font-weight:700;font-size:26px;display:grid;place-items:center">${c.glyph}</div>
  <div class="abs" style="left:82px;top:18px;font-weight:650;font-size:23px">${c.title}</div>
  <div class="abs t2" style="left:272px;top:20px;font-size:17px">now</div>
  <div class="abs t2" style="left:82px;top:56px;font-size:19px;color:#C7C7CC">${c.body}</div></div>`));

// Station 4: the Decisions table
const TX = 3260, TT = 1556;
el(`<div class="card" style="left:${TX}px;top:${TT}px;width:620px;height:460px"></div>`);
el(`<div class="abs t1" style="left:${TX + 84}px;top:${TT + 24}px;font-size:27px">Decisions</div>`);
el(`<div class="abs t2 mono" style="left:${TX + 248}px;top:${TT + 30}px;font-size:18px">gpt-6-luna · 1 request</div>`);
const RAILX = 3300, ROWS = [1660, 1780, 1900];
el(`<div class="abs" style="left:${RAILX - 3}px;top:${ROWS[0]}px;width:6px;height:${ROWS[2] - ROWS[0]}px;background:#3A3A3C;border-radius:3px"></div>`);
const ROWDATA = [["Scene 1", "0.0–1.5 s · “Wait”", "hook", 3], ["Scene 2", "1.5–3.0 s", "value", 2], ["Scene 3", "3.0–4.5 s · “Follow!”", "cta", 3]];
const rows = ROWDATA.map(([n, sub, beat, hold], i) => {
  const y = ROWS[i];
  const hi = el(`<div class="abs" style="left:${TX + 12}px;top:${y - 52}px;width:596px;height:104px;border-radius:18px;background:#2C2C2E;opacity:0"></div>`);
  el(`<div class="abs" style="left:${TX + 84}px;top:${y - 36}px;font-weight:620;font-size:24px">${n}</div>`);
  el(`<div class="abs t2" style="left:${TX + 84}px;top:${y + 2}px;font-size:18px">${sub}</div>`);
  const pill = el(`<div class="pill" style="left:${TX + 330}px;top:${y - 20}px;background:${BEAT[beat]}">${beat}</div>`);
  const bars = [0, 1, 2, 3].map((k) => el(`<div class="abs" style="left:${TX + 470 + k * 28}px;top:${y - 14}px;width:20px;height:28px;border-radius:5px;background:#3A3A3C"></div>`));
  return { hi, pill, bars, hold, beat };
});
const strip = ["hook", "value", "cta"].map((b, i) => el(`<div class="abs" style="left:${TX + 84 + i * 172}px;top:${TT + 398}px;width:0;height:30px;border-radius:8px;background:${BEAT[b]}"></div>`));

// Station 5: Export button and toast
const BX = 2480, BY = 2200;
const btn = el(`<div class="abs" style="left:${BX}px;top:${BY}px;width:240px;height:64px;border-radius:18px;background:var(--acc);font-weight:650;font-size:25px;display:grid;place-items:center">Export</div>`);
el(`<div class="abs t2 mono" style="left:${BX - 196}px;top:${BY + 92}px;font-size:21px">npx shortform-breakdown analyze clip.mp4</div>`);
const toast = el(`<div class="card" style="left:1830px;top:2150px;width:590px;height:150px;border-radius:24px;transform-origin:100% 50%">
  <div class="abs" style="left:24px;top:22px;font-weight:650;font-size:24px">Wrote clip.mp4.breakdown/</div>
  <div class="abs" style="left:24px;top:76px;display:flex;gap:10px">
    ${["analysis.json", "report.html", "sheet.jpg"].map((f) => `<span class="mono" style="background:#2C2C2E;border-radius:10px;padding:8px 12px;font-size:19px">${f}</span>`).join("")}</div></div>`);

const halo = el(`<div id="halo"></div>`);
const hero = el(`<div id="hero"></div>`);

// ---------- the hero's path (pure function of time) ----------
const P = {
  off: [592, 510], on: [648, 510], strip0: [X0 + 20, TY - R], strip1: [X3 - 20, TY - R],
  c1: [CARDS[0].x + 130, CARDS[0].y - R], c2: [CARDS[1].x + 130, CARDS[1].y - R], c3: [CARDS[2].x + 130, CARDS[2].y - R],
  r0: [RAILX, ROWS[0]], r1: [RAILX, ROWS[1]], r2: [RAILX, ROWS[2]], btn: [BX + 120, BY - R],
};
const arc = (a, b, t0, t1) => { const d = t1 - t0, vx = (b[0] - a[0]) / d, vy = (b[1] - a[1] - .5 * G * d * d) / d;
  return { t0, t1, f: (t) => { const s = t - t0; return [a[0] + vx * s, a[1] + vy * s + .5 * G * s * s]; } }; };
const line = (a, b, t0, t1, e = ease) => ({ t0, t1, f: (t) => { const k = e(seg(t, t0, t1)); return [lerp(a[0], b[0], k), lerp(a[1], b[1], k)]; } });
const hold = (a, t0, t1) => ({ t0, t1, f: () => a });

// The launch: real flight under G from the button to the toggle with a chosen apex, slowed most at the apex.
const LAUNCH0 = 7.85, LAND = 12;
const APEX = -260, up = P.btn[1] - APEX, dn = P.off[1] - APEX;
const T_UP = Math.sqrt(2 * up / G), T_FLIGHT = T_UP + Math.sqrt(2 * dn / G);
const LVX = (P.off[0] - P.btn[0]) / T_FLIGHT, LVY = -G * T_UP;
const warp = (() => {          // tau(s): real flight time at warped time s, speed 1 − 0.9·sin(πu)^0.6, normalised
  const N = 2400, speed = (u) => 1 - 0.9 * Math.pow(Math.sin(Math.PI * u), 0.6), acc = [0];
  for (let i = 1; i <= N; i++) acc.push(acc[i - 1] + speed((i - .5) / N) / N);
  return (u) => { const x = clamp(u) * N, i = Math.floor(x); const v = i >= N ? acc[N] : lerp(acc[i], acc[i + 1], x - i); return v / acc[N] * T_FLIGHT; };
})();
const launch = { t0: LAUNCH0, t1: LAND, f: (t) => { const s = warp(seg(t, LAUNCH0, LAND)); return [P.btn[0] + LVX * s, P.btn[1] + LVY * s + .5 * G * s * s]; } };

const PATH = [
  line(P.off, P.on, 0, 0.55, (x) => spring(x * 0.55, 13, 0.9)),
  arc(P.on, P.strip0, 0.55, 0.95),
  line(P.strip0, P.strip1, 0.95, 2.75, (x) => ease(x) * 0.15 + x * 0.85),
  arc(P.strip1, P.c1, 2.75, 3.20), arc(P.c1, P.c2, 3.20, 3.65), arc(P.c2, P.c3, 3.65, 4.10), arc(P.c3, P.r0, 4.10, 4.65),
  hold(P.r0, 4.65, 4.95), line(P.r0, P.r1, 4.95, 5.45), hold(P.r1, 5.45, 5.75), line(P.r1, P.r2, 5.75, 6.25), hold(P.r2, 6.25, 6.45),
  arc(P.r2, P.btn, 6.45, 7.30), hold(P.btn, 7.30, LAUNCH0), launch,
];
const CONTACTS = [0, 0.95, 3.20, 3.65, 4.10, 4.65, 7.30, 12];
function heroAt(t) { for (const p of PATH) if (t <= p.t1) return p.f(Math.max(t, p.t0)); return PATH[PATH.length - 1].f(LAND); }
const velAt = (t) => { const a = heroAt(Math.max(0, t - 1 / 240)), b = heroAt(Math.min(DUR, t + 1 / 240)); return [(b[0] - a[0]) * 120, (b[1] - a[1]) * 120]; };

// ---------- the camera (baked at load) ----------
// [time, anchorX, anchorY, anchor weight, zoom]
const SHOTS = [
  [0, 560, 488, 1, 1.15], [0.6, 1510, 540, 0.7, 0.98], [2.8, 2700, 1060, 0.15, 0.86], [4.45, 3570, 1780, 0.7, 1.0],
  [6.5, 2800, 2060, 0.15, 0.86], [7.25, 2330, 2210, 0.85, 1.02],
];
const shotAt = (t) => { let s = SHOTS[0]; for (const x of SHOTS) if (t >= x[0]) s = x; return s; };
const START = { x: 560, y: 488, z: 1.15 }, REVEAL = { x: 2120, y: 1110, z: 0.39 };
const STEP = 1 / 240, BAKE = [];
(() => {
  let x = START.x, y = START.y, z = START.z, vx = 0, vy = 0, vz = 0; const w = 6;
  for (let i = 0; i <= Math.round(DUR / STEP); i++) {
    const t = i * STEP, [hx, hy] = heroAt(t), [ux, uy] = velAt(t), [, ax, ay, k, zz] = shotAt(t);
    const follow = clamp(t / 0.8);                         // blend from the fixed first framing into following
    const tx = lerp(START.x, lerp(hx + ux * .15, ax, k), follow), ty = lerp(START.y, lerp(hy + uy * .15, ay, k), follow), tz = lerp(START.z, zz, follow);
    BAKE.push([x, y, z]);
    vx += (w * w * (tx - x) - 2 * w * vx) * STEP; x += vx * STEP;
    vy += (w * w * (ty - y) - 2 * w * vy) * STEP; y += vy * STEP;
    vz += (w * w * (tz - z) - 2 * w * vz) * STEP; z += vz * STEP;
  }
})();
const baked = (t) => { const f = clamp(t / STEP, 0, BAKE.length - 1), i = Math.floor(f), j = Math.min(i + 1, BAKE.length - 1), k = f - i;
  return BAKE[i].map((v, n) => lerp(v, BAKE[j][n], k)); };
const toReveal = kf([[LAUNCH0 + 0.05, 0], [8.75, 1]]);
const toStart = kf([[11.15, 0], [12, 1]]);
const tilt = kf([[LAUNCH0, 0], [8.75, 20], [11.0, 20], [11.9, 0]]);
function camAt(t) {
  const [fx, fy, fz] = baked(t), r = toReveal(t), s = toStart(t);
  const fixed = { x: lerp(REVEAL.x, START.x, s), y: lerp(REVEAL.y, START.y, s), z: Math.exp(lerp(Math.log(REVEAL.z), Math.log(START.z), s)) };
  return { x: lerp(fx, fixed.x, r), y: lerp(fy, fixed.y, r), z: Math.exp(lerp(Math.log(fz), Math.log(fixed.z), r)), tilt: tilt(t) };
}

// ---------- seek ----------
const cam = document.getElementById("cam");
const RESET = (t) => ease(seg(t, 9.6, 10.4));           // every station resets during the reveal hold
const px = (v) => `${v.toFixed(2)}px`;
window.seek = function seek(T) {
  const t = ((T % DUR) + DUR) % DUR, reset = RESET(t);
  const c = camAt(t);
  cam.style.transform = `translate(${W / 2}px,${H / 2}px) rotateX(${c.tilt.toFixed(3)}deg) scale(${c.z.toFixed(5)}) translate(${px(-c.x)},${px(-c.y)})`;

  // hero: squash on contact, stretch in flight, bigger and haloed during the reveal
  const [hx, hy] = heroAt(t), [vx, vy] = velAt(t), sp = Math.hypot(vx, vy);
  let sq = 0; for (const tc of CONTACTS) { const d = t - tc; if (d >= 0 && d < 0.14) sq = Math.max(sq, Math.pow(1 - d / 0.14, 2)); if (tc === 12 && t > 11.99) sq = 0; }
  if (t < 0.14) sq = Math.max(sq, Math.pow(1 - t / 0.14, 2));
  const inFlight = sq === 0 && sp > 400, st = inFlight ? clamp(sp / 9000) * 0.15 : 0;
  const big = 1 + 1.6 * toReveal(t) * (1 - toStart(t));
  const ang = Math.atan2(vy, vx) * 180 / Math.PI;
  hero.style.transform = `translate(${px(hx)},${px(hy + sq * R * 0.2)}) ` + (inFlight
    ? `rotate(${ang.toFixed(2)}deg) scale(${(big * (1 + st)).toFixed(4)},${(big * (1 - st * .66)).toFixed(4)})`
    : `scale(${(big * (1 + .25 * sq)).toFixed(4)},${(big * (1 - .2 * sq)).toFixed(4)})`);
  halo.style.transform = `translate(${px(hx)},${px(hy)}) scale(${big.toFixed(3)})`;
  halo.style.opacity = (0.9 * toReveal(t) * (1 - toStart(t))).toFixed(3);

  // 1 · toggle: on while the knob slides, off again on reset; the empty slot shows where the hero belongs
  const on = t < 0.55 ? spring(t * 1.0, 13, 0.9) : 1 - reset;
  tog.style.background = `rgb(${lerp(58, 10, on)},${lerp(58, 132, on)},${lerp(60, 255, on)})`;
  slotOn.style.opacity = (t > 0.6 ? (1 - reset) : 0).toFixed(3);
  slotOff.style.opacity = (t > 10.2 ? seg(t, 10.2, 10.6) : 0).toFixed(3);

  // 2 · film strip: scenes fill behind the hero, cuts pop as it passes
  const sx = t >= 0.95 && t < LAUNCH0 + 1 ? clamp(hx, X0, X3) : (t >= LAUNCH0 ? X3 : X0);
  fills.forEach((f, i) => { const a = X0 + i * (X3 - X0) / 3, b = a + (X3 - X0) / 3; f.style.width = px(clamp(sx - a, 0, b - a) * (1 - reset)); });
  const passed = [XB, XC].map((x) => (t >= 0.95 && hx >= x) || t >= 2.75);
  const passT = [XB, XC].map((x) => { for (let s = 0.95; s <= 2.75; s += 0.005) if (heroAt(s)[0] >= x) return s; return 2.75; });
  cuts.forEach((n, i) => { const k = passed[i] ? pop(t, passT[i]) * (1 - reset) : 0; n.style.transform = `scaleY(${k.toFixed(3)})`; n.style.opacity = clamp(k * 3).toFixed(3); });
  cutTags.forEach((n, i) => { n.style.opacity = (passed[i] ? seg(t, passT[i], passT[i] + .2) * (1 - reset) : 0).toFixed(3); });
  const n = reset > .5 ? 0 : (t >= 0.95 ? 1 : 0) + passed.filter(Boolean).length;
  scCount.textContent = `detectScenes · ${n} scene${n === 1 ? "" : "s"}`;

  // 3 · cards pop in as they are hit
  [3.20, 3.65, 4.10].forEach((tc, i) => {
    const k = pop(t, tc) * (1 - reset), ghost = 0.22, push = t >= tc && t < tc + .14 ? Math.pow(1 - (t - tc) / .14, 2) * 8 : 0;
    cardEls[i].style.opacity = (ghost + (1 - ghost) * clamp(k)).toFixed(3);
    cardEls[i].style.transform = `translateY(${push.toFixed(2)}px) scale(${(0.9 + 0.1 * k).toFixed(4)})`;
  });

  // 4 · each row gets its beat and hold as the hero reaches it; the sections strip fills
  [4.65, 5.45, 6.25].forEach((tc, i) => {
    const r = rows[i], k = pop(t, tc) * (1 - reset);
    r.hi.style.opacity = (t >= tc && t < (i < 2 ? [5.45, 6.25][i] : 6.45) ? 1 : 0) * (1 - reset) * 0.9;
    r.pill.style.transform = `scale(${clamp(k, 0, 1.3).toFixed(4)})`;
    r.bars.forEach((b, j) => { const on = j < r.hold && t >= tc + .08 * (j + 1); b.style.background = on && reset < .5 ? BEAT[r.beat] : "#3A3A3C"; });
    strip[i].style.width = px(166 * easeOut(seg(t, tc, tc + .35)) * (1 - reset));
  });

  // 5 · the button takes the landing, the toast slides in
  const press = t >= 7.30 && t < 7.30 + .2 ? Math.sin(Math.PI * (t - 7.30) / .2) : 0;
  btn.style.transform = `translateY(${(press * 8).toFixed(2)}px)`;
  btn.style.boxShadow = `0 0 ${(40 * pop(t, 7.3) * (1 - reset)).toFixed(1)}px rgba(10,132,255,.7)`;
  const tk = pop(t, 7.36) * (1 - reset);
  toast.style.opacity = clamp(tk * 1.5).toFixed(3);
  toast.style.transform = `translateX(${((1 - clamp(tk)) * 60).toFixed(2)}px) scale(${(0.92 + 0.08 * tk).toFixed(4)})`;
};

// ---------- sound ----------
window.buildAudio = async function (ctx) {
  const out = ctx.createGain(); out.gain.value = 0.8; out.connect(ctx.destination);
  const r = rng(7), noise = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate), nd = noise.getChannelData(0);
  for (let i = 0; i < nd.length; i++) nd[i] = r() * 2 - 1;
  const tone = (t, f, d = .18, g = .3, type = "sine") => { if (t < 0) return; const o = ctx.createOscillator(), a = ctx.createGain(); o.type = type; o.frequency.value = f;
    a.gain.setValueAtTime(0, t); a.gain.linearRampToValueAtTime(g, t + .004); a.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(a).connect(out); o.start(t); o.stop(t + d + .05); };
  const hiss = (t, d, g, f, sweep) => { const s = ctx.createBufferSource(), bp = ctx.createBiquadFilter(), a = ctx.createGain(); s.buffer = noise; bp.type = "bandpass"; bp.Q.value = 1.2;
    bp.frequency.setValueAtTime(f, t); if (sweep) bp.frequency.exponentialRampToValueAtTime(sweep, t + d);
    a.gain.setValueAtTime(0, t); a.gain.linearRampToValueAtTime(g, t + d * .4); a.gain.linearRampToValueAtTime(0, t + d); s.connect(bp).connect(a).connect(out); s.start(t); s.stop(t + d + .05); };
  const kick = (t) => { const o = ctx.createOscillator(), a = ctx.createGain(); o.frequency.setValueAtTime(120, t); o.frequency.exponentialRampToValueAtTime(45, t + .12);
    a.gain.setValueAtTime(.35, t); a.gain.exponentialRampToValueAtTime(.0001, t + .25); o.connect(a).connect(out); o.start(t); o.stop(t + .3); };
  const beat = 60 / 115;
  for (let t = 0; t < DUR; t += beat) { if (t < LAUNCH0 || t > 11.3) kick(t); hiss(t + beat / 2, .05, .05, 8000); }
  for (let t = 0; t < DUR; t += beat * 2) tone(t, 55 * 2, .3, .12, "triangle");
  const notes = [523, 587, 659, 784, 880, 988, 1047];
  [0, 0.95, 3.20, 3.65, 4.10, 4.65, 7.30].forEach((t, i) => tone(t, notes[i], .22, .32, "sine"));
  tone(12 - 1e-3, notes[0], .22, 0);                       // the landing at 12 is the tick at 0
  tone(0.5, 1600, .04, .12, "square");                     // toggle click
  [1.65, 2.2].forEach((t) => { tone(t, 2400, .03, .1, "square"); tone(t, 330, .12, .2); });
  [5.45, 6.25].forEach((t, i) => tone(t, notes[5 + i] * 1.0, .18, .26));
  tone(7.30, 196, .3, .4, "triangle");
  hiss(LAUNCH0, 1.1, .25, 400, 4000);
  hiss(11.2, .8, .2, 4000, 400);
};

// ---------- preview ----------
const stage = document.getElementById("stage");
if (RENDER) { document.getElementById("controls").remove(); }
else {
  const fit = () => { const k = Math.min(innerWidth / W, (innerHeight - 48) / H); stage.style.transform = `scale(${k})`; };
  addEventListener("resize", fit); fit();
  let buf, ac, src, startAt = 0, offset = 0, playing = false;
  const scrub = document.getElementById("scrub"), tval = document.getElementById("tval"), pb = document.getElementById("play");
  async function play() { ac ??= new AudioContext();
    if (!buf) { const off = new OfflineAudioContext(2, Math.ceil(48000 * DUR), 48000); await buildAudio(off); buf = await off.startRendering(); }
    src = ac.createBufferSource(); src.buffer = buf; src.loop = true; src.connect(ac.destination); src.start(0, offset % DUR); startAt = ac.currentTime; playing = true; pb.textContent = "Pause"; }
  function pause() { if (!playing) return; offset += ac.currentTime - startAt; src.stop(); playing = false; pb.textContent = "Play"; }
  const now = () => playing ? (offset + ac.currentTime - startAt) % DUR : offset;
  pb.onclick = () => playing ? pause() : play();
  scrub.oninput = () => { const was = playing; pause(); offset = +scrub.value; if (was) play(); };
  (function loop() { const t = now(); seek(t); scrub.value = t; tval.textContent = t.toFixed(2); requestAnimationFrame(loop); })();
}
seek(0);
</script></body></html>
