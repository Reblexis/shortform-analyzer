name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: The tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "${GITHUB_REF_NAME}"
      - name: Publish unless this version is already on npm (0.1.0 was published by hand)
        run: |
          v=$(node -p 'require("./package.json").version')
          if npm view "shortform-analyzer@$v" version >/dev/null 2>&1; then echo "shortform-analyzer@$v is already published"; exit 0; fi
          npm publish --provenance --access public
